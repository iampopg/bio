<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1A73E8" />
    </linearGradient>
    <filter id="gGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4285F4" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M60 8 L106 24 L106 68 C106 94 60 114 60 114 C60 114 14 94 14 68 L14 24 Z" fill="#0F172A" stroke="url(#gBlue)" stroke-width="3" filter="url(#gGlow)"/>
  
  <!-- Google "G" / Security Lock -->
  <rect x="42" y="48" width="36" height="26" rx="4" fill="#4285F4"/>
  <path d="M48 48 V38 a12 12 0 0 1 24 0 v10" fill="none" stroke="#EA4335" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Keyhole in Google Yellow & Green -->
  <circle cx="60" cy="58" r="3.5" fill="#FBBC05"/>
  <polygon points="58,58 62,58 63,68 57,68" fill="#34A853"/>
  
  <!-- Ribbon Badge -->
  <rect x="18" y="88" width="84" height="18" rx="4" fill="#1A73E8"/>
  <text x="60" y="100.5" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">GOOGLE // SEC</text>
  
  <text x="60" y="24" font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.5">GOOGLE CAREER</text>
</svg>
