<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="isoEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M60 8 L106 24 L106 68 C106 94 60 114 60 114 C60 114 14 94 14 68 L14 24 Z" fill="#064E3B" stroke="url(#isoEmerald)" stroke-width="3" filter="url(#emeraldGlow)"/>
  
  <!-- Inner Rosette / Circular Audit Seal -->
  <circle cx="60" cy="54" r="22" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="60" cy="54" r="16" fill="rgba(52, 211, 153, 0.15)"/>
  
  <!-- Checkmark -->
  <polyline points="50,54 57,61 71,47" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Ribbon Badge -->
  <rect x="22" y="88" width="76" height="18" rx="4" fill="#059669"/>
  <text x="60" y="100.5" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ISO/IEC 27001</text>
  
  <text x="60" y="24" font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="700" fill="#A7F3D0" text-anchor="middle" letter-spacing="1.5">INFO SECURITY</text>
</svg>
