<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="thmRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="thmDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#0B0C12" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF3366" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Outer Hexagon Shield -->
  <polygon points="60,6 108,30 108,82 60,114 12,82 12,30" fill="url(#thmDarkBg)" stroke="url(#thmRedGrad)" stroke-width="3" filter="url(#redGlow)"/>
  
  <!-- Inner Hexagon Frame -->
  <polygon points="60,14 100,34 100,77 60,104 20,77 20,34" fill="none" stroke="rgba(255, 51, 102, 0.3)" stroke-width="1.5"/>
  
  <!-- THM Cross Logo / Emblem -->
  <path d="M46 36 L74 36 L74 46 L65 46 L65 74 L55 74 L55 46 L46 46 Z" fill="url(#thmRedGrad)"/>
  <circle cx="60" cy="58" r="16" fill="none" stroke="#FF3366" stroke-width="2" stroke-dasharray="4 2"/>
  
  <!-- Target Reticles -->
  <circle cx="60" cy="58" r="4" fill="#FFFFFF"/>
  <line x1="60" y1="38" x2="60" y2="44" stroke="#FF3366" stroke-width="2"/>
  <line x1="60" y1="72" x2="60" y2="78" stroke="#FF3366" stroke-width="2"/>
  <line x1="40" y1="58" x2="46" y2="58" stroke="#FF3366" stroke-width="2"/>
  <line x1="74" y1="58" x2="80" y2="58" stroke="#FF3366" stroke-width="2"/>
  
  <!-- Ribbon Badge -->
  <rect x="25" y="86" width="70" height="18" rx="4" fill="#EF4444"/>
  <text x="60" y="98.5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SAL1 // SOC</text>
  
  <text x="60" y="24" font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="700" fill="#F87171" text-anchor="middle" letter-spacing="1.5">TRYHACKME CERT</text>
</svg>
