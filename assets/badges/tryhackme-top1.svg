<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="darkShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B091A" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#A855F7" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <polygon points="60,6 108,30 108,82 60,114 12,82 12,30" fill="url(#darkShieldBg)" stroke="url(#purpleGrad)" stroke-width="3" filter="url(#purpleGlow)"/>
  
  <!-- Inner Glow Line -->
  <polygon points="60,14 100,34 100,77 60,104 20,77 20,34" fill="none" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5"/>
  
  <!-- Diamond / Star Emblem -->
  <polygon points="60,34 74,48 60,62 46,48" fill="url(#purpleGrad)"/>
  <circle cx="60" cy="48" r="4" fill="#FFFFFF"/>
  
  <!-- Trophy / Wreath Laurel -->
  <path d="M38 52 C34 64 42 74 60 76 C78 74 86 64 82 52" fill="none" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Ribbon Badge -->
  <rect x="22" y="86" width="76" height="18" rx="4" fill="#A855F7"/>
  <text x="60" y="98.5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">TOP 1% GLOBAL</text>
  
  <text x="60" y="24" font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="700" fill="#D8B4FE" text-anchor="middle" letter-spacing="1.5">TRYHACKME 12X</text>
</svg>
