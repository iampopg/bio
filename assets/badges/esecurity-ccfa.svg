<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M60 8 L106 24 L106 68 C106 94 60 114 60 114 C60 114 14 94 14 68 L14 24 Z" fill="url(#shieldBg)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)"/>
  
  <!-- Inner Rim -->
  <path d="M60 15 L98 29 L98 66 C98 88 60 105 60 105 C60 105 22 88 22 66 L22 29 Z" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" stroke-dasharray="3 2"/>
  
  <!-- Central Forensic Emblem (Magnifying Glass + Disk + Crosshairs) -->
  <circle cx="56" cy="52" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="56" cy="52" r="13" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(251, 191, 36, 0.5)" stroke-width="1.5"/>
  <line x1="69" y1="65" x2="88" y2="84" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Disk Platter tracks inside glass -->
  <circle cx="56" cy="52" r="6" fill="url(#goldGrad)"/>
  <path d="M56 38 L56 42 M56 62 L56 66 M42 52 L46 52 M66 52 L70 52" stroke="#FBBF24" stroke-width="1.5"/>
  
  <!-- Ribbon / Banner -->
  <rect x="25" y="88" width="70" height="18" rx="4" fill="#F59E0B"/>
  <text x="60" y="100.5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1">CCFA // 2026</text>
  
  <!-- Header Text -->
  <text x="60" y="24" font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1.5">eSECURITY INSTITUTE</text>
</svg>
